<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Site log. Ammar Kashif. Toronto. Status recording.">
<style>
  text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; }
  .route { stroke-dasharray: 565; stroke-dashoffset: 565; animation: draw 9s cubic-bezier(.4,0,.2,1) infinite; }
  .pin { opacity: 0; animation: appear 9s linear infinite; }
  .rec { animation: blink 1.6s steps(2, start) infinite; }
  .ping { transform-origin: 1136px 84px; animation: ping 2.4s ease-out infinite; }
  .cursor { animation: blink 1.1s steps(2, start) infinite; }
  @keyframes draw { 0% { stroke-dashoffset: 565; } 42% { stroke-dashoffset: 0; } 88% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 565; } }
  @keyframes appear { 0% { opacity: 0; } 6% { opacity: 1; } 88% { opacity: 1; } 94% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes blink { to { visibility: hidden; } }
  @keyframes ping { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .route, .pin, .rec, .ping, .cursor { animation: none; opacity: 1; stroke-dashoffset: 0; } }
</style>

